<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diretório de Empresas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde-escuro:#39433A; --verde:#5C9431;
  --bg:#F3F4F0; --surface:#FFFFFF; --ink:#1D231E; --ink-2:#5A645B; --line:#DADFD6;
  --aviso:#8A5A00; --aviso-bg:#FBF1D9; --ok-bg:#E4F0D8; --ok:#33600F;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141815; --surface:#1E241F; --ink:#E8EDE6; --ink-2:#9AA69B; --line:#2E372F;
  --aviso:#F0C46A; --aviso-bg:#3A2F14; --ok-bg:#243619; --ok:#A8D67F; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
header.top{background:var(--verde-escuro);color:#fff;padding:14px 16px 12px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.marca{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#B9D79B;font-weight:600}
.logo{display:block;height:46px;width:auto;background:#fff;border-radius:8px;padding:4px 10px;margin-bottom:8px}
h1{margin:2px 0 0;font-size:24px;font-weight:700;text-wrap:balance}
.acoes{display:flex;gap:8px}
.btn{min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.barra{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.barra-in{max-width:1100px;margin:0 auto;display:grid;gap:10px}
.pesq{position:relative}
.pesq input{width:100%;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 44px 0 14px;font-size:17px}
.pesq input:focus{border-color:var(--verde);outline:none}
.pesq input::-webkit-search-cancel-button{display:none}
.pesq button{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;border-radius:8px;background:transparent;font-size:22px;color:var(--ink-2);cursor:pointer}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;min-width:0;max-width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.chip b{font-weight:600;color:var(--ink-2);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--verde-escuro);color:#fff;border-color:var(--verde-escuro)}
.chip[aria-pressed="true"] b{color:#B9D79B}
.resumo{max-width:1100px;margin:0 auto;padding:12px 16px 0;color:var(--ink-2);font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
main{max-width:1100px;margin:0 auto;padding:8px 16px 48px}
.lista{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--verde);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:6px;width:100%}
.card.rever{border-left-color:#C9A24A}
.card:hover{border-color:var(--verde)}
.card h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.esp{color:var(--ink-2);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:13px;font-weight:600}
.pill.rev{background:var(--aviso-bg);color:var(--aviso)}
.zona::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verde);margin-right:6px}
.tel{font-variant-numeric:tabular-nums;font-weight:600}
.vazio{padding:40px 16px;text-align:center;color:var(--ink-2)}
.vazio strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.fundo{position:fixed;inset:0;background:rgba(10,14,11,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 20px}
@media(min-width:700px){.fundo{align-items:center}.folha{border-radius:18px}}
.folha h3{margin:0 0 4px;font-size:20px;text-wrap:balance}
.rodape{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.rodape .btn{flex:1 1 120px}
.leitura dt{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:12px}
.leitura dd{margin:2px 0 0;font-size:16px;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<div class="barra">
  <div class="barra-in">
    <div class="pesq">
      <input id="q" type="search" placeholder="Pesquisar: cofragem, revestimentos, Algarve, nome…" autocomplete="off" aria-label="Pesquisar empresas">
      <button id="limpar" type="button" aria-label="Limpar pesquisa" hidden>×</button>
    </div>
    <div class="linha">
      <select id="regiao" aria-label="Zona"></select>
      <button class="chip" id="soRever" type="button" aria-pressed="false">Por rever<b id="nRever">0</b></button>
      <button class="chip" id="limparTudo" type="button">Limpar filtros</button>
    </div>

  </div>

<main><div class="lista" id="lista"></div></main>
<div id="camada"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const SIN = { confragem:['cofragem'], cofragem:['confragem'], capoto:['etics','isolamento'], etics:['capoto'], serralheiro:['serralharia'], eletricista:['eletrica','eletricidade'], electricista:['eletrica','eletricidade'], pintor:['pintura','pinturas'], canalizador:['canalizacao','redes'], betao:['betao','agregados'], andaime:['andaimes'], impermeabilizacao:['impermeabilizacoes','revestimentos'], revestimento:['revestimentos'] };
const REGIOES = ['Algarve','Alentejo','Centro','Lisboa e Setúbal','Norte e Aveiro','Todo o país','Por confirmar'];
const S = { itens:new Map(), q:'', cat:'', regiao:'', soRever:false };

function corresponde(it, tokens){
  const palheiro = norm([it.empresa,it.especialidade,it.categoria,it.zona,it.regiao,it.contacto,it.nota].join(' '));
  return tokens.every(t => palheiro.includes(t) || (SIN[t]||[]).some(x => palheiro.includes(x)));
}
function filtrados(ignorarCat){
  const tokens = norm(S.q).split(/\s+/).filter(Boolean);
  return [...S.itens.values()].filter(it =>
    (!S.regiao || it.regiao === S.regiao) &&
    (!S.soRever || it.estado !== 'ok') &&
    (ignorarCat || !S.cat || it.categoria === S.cat) &&
    (!tokens.length || corresponde(it, tokens))
  ).sort((a,b)=> (a.empresa||'').localeCompare(b.empresa||'','pt'));
}

function desenhar(){
  const todos = [...S.itens.values()];
  const base = filtrados(true);
  const cats = new Map();
  base.forEach(i => cats.set(i.categoria||'a identificar',(cats.get(i.categoria||'a identificar')||0)+1));
  const ordem = [...cats.keys()].sort((a,b)=>a.localeCompare(b,'pt'));
  $('#chips').innerHTML = `<button class="chip" type="button" data-cat="" aria-pressed="${S.cat===''}">Todos<b>${base.length}</b></button>` +
    ordem.map(c=>`<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}<b>${cats.get(c)}</b></button>`).join('');
  const regs = new Set(REGIOES); todos.forEach(i=>i.regiao&&regs.add(i.regiao));
  const sel = $('#regiao'); const atual = S.regiao;
  sel.innerHTML = `<option value="">Todas as zonas</option>` + [...regs].map(r=>`<option ${r===atual?'selected':''}>${esc(r)}</option>`).join('');
  $('#nRever').textContent = todos.filter(i=>i.estado!=='ok').length;
  $('#soRever').setAttribute('aria-pressed', S.soRever);
  $('#limpar').hidden = !S.q;
  const lista = filtrados(false);
  $('#contagem').textContent = `${lista.length} de ${todos.length} empresas`;
  if(!lista.length){
    $('#lista').innerHTML = `<div class="vazio"><strong>Nenhuma empresa encontrada.</strong>Experimenta outra palavra ou limpa os filtros.</div>`; return;
  }
  $('#lista').innerHTML = lista.map(it=>`
    <button class="card ${it.estado==='ok'?'':'rever'}" type="button" data-id="${esc(it.id)}">
      <h2>${esc(it.empresa)}</h2>
      <div class="esp">${esc(it.especialidade||'Especialidade por indicar')}</div>
      <div class="meta">
        <span class="pill ${it.estado==='ok'?'':'rev'}">${esc(it.categoria||'a identificar')}</span>
        <span class="zona">${esc(it.zona||'Zona por confirmar')}</span>
        ${it.contacto?`<span class="tel">${esc(it.contacto)}</span>`:''}
      </div>
    </button>`).join('');
}

function abrirFicha(id){
  const it = S.itens.get(id); if(!it) return;
  $('#camada').innerHTML = `<div class="fundo" id="fundo"><div class="folha" role="dialog" aria-modal="true">
      <h3>${esc(it.empresa)}</h3>
      <dl class="leitura">
        <dt>Especialidade</dt><dd>${esc(it.especialidade||'—')}</dd>
        <dt>Tipo de trabalho</dt><dd>${esc(it.categoria||'—')}</dd>
        <dt>Localidade</dt><dd>${esc(it.zona||'—')} (${esc(it.regiao||'—')})</dd>
        <dt>Contacto</dt><dd>${esc(it.contacto||'—')}</dd>
        <dt>Observações</dt><dd>${esc(it.nota||'—')}</dd>
      </dl>
      <div class="rodape"><button class="btn" id="fechar" type="button">Fechar</button></div>
    </div></div>`;
  $('#fundo').addEventListener('click',e=>{ if(e.target.id==='fundo') fechar(); });
  $('#fechar').addEventListener('click',fechar);
}
function fechar(){ $('#camada').innerHTML=''; }

function csv(){
  const cols=['empresa','especialidade','categoria','zona','regiao','contacto','nota','estado','origem'];
  const cab=['Empresa','Especialidade','Tipo de trabalho','Localidade','Zona','Contacto','Observações','Estado','Origem'];
  const cel=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  return [cab.map(cel).join(';'), ...filtrados(false).map(i=>cols.map(c=>cel(c==='estado'?(i.estado==='ok'?'Verificada':'Por rever'):i[c])).join(';'))].join('\r\n');
}
function exportar(){
  const texto='﻿'+csv(); const nome='empresas-aquino-'+new Date().toISOString().slice(0,10)+'.csv';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([texto],{type:'text/csv;charset=utf-8'})); a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}
